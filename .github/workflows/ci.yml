name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Rush change verification diffs against the target branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Corepack activates the pnpm version pinned in package.json / rush.json.
      - name: Enable Corepack
        run: corepack enable

      # Install via the Rush bootstrap (fixed in REL-2 to load under ESM).
      - name: Rush install
        run: node common/scripts/install-run-rush.js install

      - name: Rush build
        run: node common/scripts/install-run-rush.js build --verbose

      - name: Rush lint
        run: node common/scripts/install-run-rush.js lint

      # Separate from the build: the build only typechecks what ships, and for a long time
      # nothing checked the tests at all. A test that stops matching the API it exercises is
      # how a green suite starts proving the wrong thing.
      - name: Rush typecheck
        run: node common/scripts/install-run-rush.js typecheck

      - name: Rush test
        run: node common/scripts/install-run-rush.js test

      # After the build, because it measures build output. The budgets hold the bundle-size
      # claims the READMEs make; without this they were assertions nobody could fail.
      - name: Rush size
        run: node common/scripts/install-run-rush.js size

      # The committed API reference must carry the logo on every page. TypeDoc rewrites the whole
      # tree on each run, so a regeneration that skipped the stamping step would silently strip it
      # from hundreds of files — and a docs diff that large is exactly the kind nobody reads line
      # by line before approving.
      - name: Verify docs are stamped
        run: |
          node tools/repo-tools/bin/docs-stamp.mjs --check \
            packages/*/docs devtools/*/docs

      # Stamping proves a page carries a logo, not that it is true. The reference drifted a whole
      # minor release once — eight public symbols with no page at all — because nothing regenerated
      # it and compared. TypeDoc output is deterministic, so a clean tree after `rush docs` means
      # the committed reference matches the source. The check uses `git status` rather than
      # `git diff` on purpose: a release that adds API adds untracked pages, which diff cannot see.
      - name: Verify docs are current
        run: |
          node common/scripts/install-run-rush.js docs
          node tools/repo-tools/bin/check-docs-current.mjs

      # Fails if a changed project is missing a change file (keeps CHANGELOGs honest).
      - name: Verify change files
        run: node common/scripts/install-run-rush.js change --verify
